apiVersion: apps/v1
kind: Deployment
metadata:
  name: leafguard-ui
  labels:
    app: leafguard-ui
  namespace: dev
spec:
  replicas: 0
  selector:
    matchLabels:
      app: leafguard-ui
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: leafguard-ui
    spec:
      containers:
      - image: 287559100945.dkr.ecr.ap-south-1.amazonaws.com/aimlops-leafguard-ui:latest
        env:
        - name: NEXT_PUBLIC_API_URL
          valueFrom:
            configMapKeyRef:
              name: leafguard-ui-cfg
              key: api_url
        imagePullPolicy: Always
        name: leafguard-ui
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        
